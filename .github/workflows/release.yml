name: Build and release Tool Edit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: tool-edit-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: private-source/commercial-editor
    steps:
      - name: Read private source branch
        uses: actions/checkout@v4
        with:
          repository: MKPPF/tool-video
          ref: tool-edit-sales
          ssh-key: ${{ secrets.TOOL_EDIT_SOURCE_SSH_KEY }}
          path: private-source
          sparse-checkout: commercial-editor
          persist-credentials: true
      - name: Exclude unrelated legacy submodules from temporary build index
        run: |
          git -C .. ls-files --stage | ForEach-Object {
            if ($_ -match '^160000 .*\t(.+)$') {
              git -C .. update-index --force-remove -- $Matches[1]
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          git -C .. config --local --unset-all core.sshCommand
          git -C .. config --local --unset-all http.https://github.com/.extraheader
          exit 0
      - name: Check whether source changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = git rev-parse HEAD
          $body = gh release view --repo $env:GITHUB_REPOSITORY --json body --jq .body 2>$null
          $publish = -not ($body -and $body.Contains("Source commit: $source"))
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "source=$source" >> $env:GITHUB_OUTPUT
          "version=2.2.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Set up Python
        if: steps.changed.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        if: steps.changed.outputs.publish == 'true'
        run: python -m pip install -r requirements-build.txt -r requirements-video.txt
      - name: Test edit and distribution
        if: steps.changed.outputs.publish == 'true'
        run: |
          python -m unittest -v test_editor test_distribution test_recipe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build customer installer
        if: steps.changed.outputs.publish == 'true'
        run: python build_release.py --version '${{ steps.changed.outputs.version }}'
      - name: Verify packaged app and installer
        if: steps.changed.outputs.publish == 'true'
        run: python smoke_packaged.py
      - name: Sign update feed
        if: steps.changed.outputs.publish == 'true'
        env:
          TOOL_EDIT_UPDATE_PRIVATE_KEY: ${{ secrets.TOOL_EDIT_UPDATE_PRIVATE_KEY }}
        run: python seller.py sign-release --archive release/ToolEdit-Windows.zip --version '${{ steps.changed.outputs.version }}' --repository $env:GITHUB_REPOSITORY --output release/latest.json
      - name: Publish signed binaries
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.changed.outputs.version }}'
          $source = '${{ steps.changed.outputs.source }}'
          $notes = "Tool Edit $version`n`nSource commit: $source`n`nWindows 64-bit. Install ToolEdit-Setup.exe. Existing license and video data are preserved during upgrades."
          $notes | Out-File -LiteralPath release/release-notes.txt -Encoding utf8
          gh release create "v$version" release/ToolEdit-Setup.exe release/ToolEdit-Windows.zip release/latest.json --repo $env:GITHUB_REPOSITORY --title "Tool Edit $version" --notes-file release/release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
